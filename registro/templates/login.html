{% extends 'base.html' %}
{% block contenido %}
<div class="tarjeta estrecha">
  <h1>Registro vascular</h1>
  <p class="tenue">Accede con tu correo del hospital.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="campo"><label for="email">Correo</label><input id="email" name="email" type="email" required autofocus></div>
    <div class="campo"><label for="password">Contraseña</label><input id="password" name="password" type="password" required></div>
    <button class="boton">Entrar</button>
  </form>
</div>
{% endblock %}
