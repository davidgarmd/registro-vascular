{% extends 'base.html' %}
{% block contenido %}
<h1>Usuarios</h1>
<table>
  <thead><tr><th>Nombre</th><th>Correo</th><th>Rol</th><th>Estado</th><th></th></tr></thead>
  <tbody>
  {% for u in usuarios %}
    <tr class="{% if not u.activo %}inactivo{% endif %}">
      <td>{{ u.nombre }}</td><td>{{ u.email }}</td><td>{{ 'Administrador' if u.es_admin else 'Cirujano' }}</td>
      <td>{{ 'Activo' if u.activo else 'Inactivo' }}</td>
      <td class="acciones-fila">
        <form method="post" action="{{ url_for('auth.alternar_activo', usuario_id=u.id) }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button class="boton pequeno secundario">{{ 'Desactivar' if u.activo else 'Activar' }}</button>
        </form>
        <form method="post" action="{{ url_for('auth.restablecer_password', usuario_id=u.id) }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <input name="password" type="password" placeholder="Nueva contraseña" minlength="{{ minimo }}" required aria-label="Nueva contraseña">
          <button class="boton pequeno secundario">Restablecer</button>
        </form>
      </td>
    </tr>
  {% endfor %}
  </tbody>
</table>
<section class="seccion">
  <h2>Nuevo usuario</h2>
  <form method="post" class="rejilla">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="campo"><label for="nombre">Nombre</label><input id="nombre" name="nombre" required></div>
    <div class="campo"><label for="email">Correo (recibirá los recordatorios)</label><input id="email" name="email" type="email" required></div>
    <div class="campo"><label for="password">Contraseña inicial (mín. {{ minimo }})</label><input id="password" name="password" type="password" minlength="{{ minimo }}" required></div>
    <label class="opcion"><input type="checkbox" name="es_admin" value="1"><span>Administrador</span></label>
    <div><button class="boton">Crear usuario</button></div>
  </form>
</section>
{% endblock %}
